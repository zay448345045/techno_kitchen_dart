name: Import All Branches from External Repo with Suffix

on:
  workflow_dispatch:
    inputs:
      external_repo:
        description: '外部仓库 (格式: owner/repo)'
        required: true
        type: string

jobs:
  import_branches:
    runs-on: ubuntu-latest 
    permissions:
      contents: write

    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 配置 Git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 3. 拉取外部仓库的所有分支并在名称后加“1”
        run: |
          EXT_REPO="${{ inputs .external_repo }}"

          # 添加外部仓库为临时 remote
          git remote add external "https://github.com/${EXT_REPO}.git"

          # 获取外部仓库的所有分支
          git fetch external

          # 遍历所有远程分支
          for branch in $(git branch -r | grep -v '\->' | grep -v 'main' | grep -v 'master' | sed 's/ *external\///'); do
            # 在分支名称后加“1”
            new_branch="${branch}1" 

            # 检查本地是否已经存在同名分支，如果不存在则创建
            if ! git show-ref --verify --quiet "refs/heads/${new_branch}"; then
              git checkout -b "$new_branch" "external/$branch"
              git push origin "$new_branch"
            else
              echo "Branch ${new_branch} already exists, skipping."
            fi
          done

          # 清理临时 remote
          git remote remove external
